name: joss-paper-d

# Render the JOSS-format methodology paper (Paper D) and check its structure.
# Layout-agnostic: works whether the package sits at the repository root or
# in a subdirectory (the package root is detected at runtime).

on:
  push:
    paths:
      - '**/papers/paper_D_methodology/joss/paper.md'
      - '**/papers/paper_D_methodology/joss/paper.bib'
      - 'papers/paper_D_methodology/joss/paper.md'
      - 'papers/paper_D_methodology/joss/paper.bib'
  workflow_dispatch:

jobs:
  paper:
    name: render paper.pdf (openjournals draft action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: locate the paper
        id: loc
        run: |
          PKG="$([ -d v20 ] && echo v20 || echo .)"
          echo "path=${PKG}/papers/paper_D_methodology/joss/paper.md" >> "$GITHUB_OUTPUT"
          echo "dir=${PKG}/papers/paper_D_methodology/joss" >> "$GITHUB_OUTPUT"
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: ${{ steps.loc.outputs.path }}
      - uses: actions/upload-artifact@v4
        with:
          name: paper_D_pdf
          path: ${{ steps.loc.outputs.dir }}/paper.pdf

  structure:
    name: front matter, word count, citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: validate paper.md
        run: |
          PKG="$([ -d v20 ] && echo v20 || echo .)"
          python3 - "${PKG}/papers/paper_D_methodology/joss" <<'EOF'
          import re, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          text = (d / "paper.md").read_text()
          fm = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
          assert fm, "no YAML front matter"
          for k in ("title", "tags", "authors", "affiliations", "date", "bibliography"):
              assert f"{k}:" in fm.group(1), f"missing field: {k}"
          body = re.sub(r"^---.*?---", "", text, count=1, flags=re.DOTALL)
          body = re.sub(r"# References.*", "", body, flags=re.DOTALL)
          words = len(re.sub(r"\[@\w+\]", "", re.sub(r"#.*", "", body)).split())
          if words > 1000:
              print(f"::warning::word count {words} exceeds the JOSS limit of 1000; cut before submitting (see SUBMIT.md)")
          assert 250 <= words <= 2000, f"word count {words} outside [250, 2000]"
          entries = set(re.findall(r"@\w+\{(\w+),", (d / "paper.bib").read_text()))
          cites = set(re.findall(r"@(\w+)", text)) - {""}
          assert not (cites - entries), f"unresolved citations: {cites - entries}"
          print(f"OK: {words} words, {len(cites)} citations resolved")
          EOF
