name: claim-verification

# Bind prose claims to executable facts about the artifact. Two jobs:
#   1. claim-verification: every load-bearing claim in CLAIMS.json must be
#      backed by the repository's actual state (fails on ASSERTED + UNBACKED).
#   2. detector-sensitivity: regression guard on the detector itself — runs the
#      current tool + manifest against a known-bad historical tree and REQUIRES
#      the false signing claim to still be caught on >= the sensitivity floor.
#
# LAYOUT-AGNOSTIC BY DESIGN. This file is maintained inside the package
# (v12.0.0/.github/workflows/) and is promoted verbatim to the public
# repository root by the package-overlay sync. An earlier, layout-specific
# version was clobbered by exactly that sync and went silently dead (its
# `v12.0.0/**` path filters matched nothing in the root layout). Hence:
#   * path triggers list BOTH layouts' variants;
#   * run steps detect the package directory at runtime;
#   * the retro-guard script auto-detects its historical commit by layout.
# Do not reintroduce layout-specific working directories here —
# CLAIMS.json (`package-workflows-layout-agnostic`) fails the build if you do.
#
# See docs/claim_verification.md for design and limitations.

on:
  push:
    paths:
      - 'CLAIMS.json'
      - 'v12.0.0/CLAIMS.json'
      - 'scripts/verify_claims.py'
      - 'v12.0.0/scripts/verify_claims.py'
      - 'scripts/verify_claims_retro_test.sh'
      - 'v12.0.0/scripts/verify_claims_retro_test.sh'
      - '**/*.md'
      - 'CITATION.cff'
      - 'v12.0.0/CITATION.cff'
      - 'predictions_register/**'
      - 'v12.0.0/predictions_register/**'
      - '.github/workflows/claim_verification.yml'
  pull_request:
    paths:
      - 'CLAIMS.json'
      - 'v12.0.0/CLAIMS.json'
      - 'scripts/verify_claims.py'
      - 'v12.0.0/scripts/verify_claims.py'
      - 'scripts/verify_claims_retro_test.sh'
      - 'v12.0.0/scripts/verify_claims_retro_test.sh'
      - '**/*.md'
      - 'CITATION.cff'
      - 'v12.0.0/CITATION.cff'
      - 'predictions_register/**'
      - 'v12.0.0/predictions_register/**'
  workflow_dispatch:

jobs:
  claim-verification:
    name: claims are backed by the artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python (stdlib-only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: verify every claim against the artifact (layout-detected)
        run: |
          PKG="$([ -d v12.0.0 ] && echo v12.0.0 || echo .)"
          echo "package root: ${PKG}"
          cd "${PKG}" && python3 scripts/verify_claims.py --explain

  detector-sensitivity:
    name: detector still catches the historical false claim
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout (full history — retro-test needs the historical commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup python (stdlib-only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: retro-test (requires a FAILURE on the historical tree to pass)
        run: |
          PKG="$([ -d v12.0.0 ] && echo v12.0.0 || echo .)"
          echo "package root: ${PKG}"
          cd "${PKG}" && bash scripts/verify_claims_retro_test.sh
